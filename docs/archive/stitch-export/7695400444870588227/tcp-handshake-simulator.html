<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#d2bbff",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#fffbff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#007793",
                        "on-tertiary-container": "#dcf4ff",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed-dim": "#b4c5ff",
                        "error-container": "#ffdad6",
                        "background": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#25005a",
                        "surface-container-highest": "#e0e3e5",
                        "outline": "#737686",
                        "tertiary-fixed-dim": "#6cd3f7",
                        "on-tertiary-fixed": "#001f28",
                        "inverse-primary": "#b4c5ff",
                        "secondary-fixed": "#eaddff",
                        "surface": "#f7f9fb",
                        "surface-tint": "#0053db",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "surface-variant": "#e0e3e5",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#004e61",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "secondary-container": "#8a4cfc",
                        "secondary": "#712ae2",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed": "#00174b",
                        "primary": "#004ac6",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#eeefff",
                        "on-background": "#191c1e",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-fixed": "#b7eaff",
                        "primary-container": "#2563eb",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "inverse-surface": "#2d3133",
                        "tertiary": "#005d73",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "1.5rem",
                        "margin-desktop": "2.5rem",
                        "margin-mobile": "1rem",
                        "container-max": "1280px",
                        "panel-padding": "1.25rem",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "code": ["jetbrainsMono"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "code": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .canvas-grid {
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .active-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .node-glow {
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg overflow-hidden h-screen flex flex-col">
<!-- Top Navigation -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors py-2 px-3 rounded-lg">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="font-body-sm text-body-sm">返回详情</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface ml-4">TCP 三次握手模拟器</h1>
</div>
<div class="flex items-center gap-3">
<button class="bg-white border border-outline-variant text-on-surface hover:bg-surface-container-low transition-all px-4 py-2 rounded-lg font-body-sm text-body-sm flex items-center gap-2" onclick="window.location.reload()">
<span class="material-symbols-outlined text-[18px]">restart_alt</span>
                重置
            </button>
</div>
</header>
<main class="flex flex-1 mt-16 overflow-hidden">
<!-- Sidebar Left (SideNavBar logic from JSON - Suppressed based on "Back" action rule, but used for visual reference) -->
<!-- Center Interaction Canvas -->
<div class="flex-1 relative flex flex-col items-center justify-center canvas-grid bg-white">
<div class="absolute top-12 left-1/2 -translate-x-1/2 flex items-center gap-80">
<!-- Client Entity -->
<div class="flex flex-col items-center gap-4 group">
<div class="w-32 h-32 rounded-xl bg-surface border-2 border-primary node-glow flex flex-col items-center justify-center p-4 relative">
<div class="absolute -top-3 px-3 py-0.5 bg-primary text-white rounded-full font-label-caps text-label-caps">CLIENT</div>
<span class="material-symbols-outlined text-[48px] text-primary">laptop_mac</span>
<div class="mt-2 font-code text-primary font-bold">192.168.1.5</div>
</div>
<div class="px-4 py-1.5 rounded-full bg-surface-container-high border border-outline text-on-surface-variant font-code text-body-sm transition-all duration-300" id="client-state">
                        CLOSED
                    </div>
</div>
<!-- Server Entity -->
<div class="flex flex-col items-center gap-4">
<div class="w-32 h-32 rounded-xl bg-surface border-2 border-tertiary flex flex-col items-center justify-center p-4 relative">
<div class="absolute -top-3 px-3 py-0.5 bg-tertiary text-white rounded-full font-label-caps text-label-caps">SERVER</div>
<span class="material-symbols-outlined text-[48px] text-tertiary">dns</span>
<div class="mt-2 font-code text-tertiary font-bold">10.0.0.1:80</div>
</div>
<div class="px-4 py-1.5 rounded-full bg-tertiary-container/10 border border-tertiary text-tertiary font-code text-body-sm" id="server-state">
                        LISTEN
                    </div>
</div>
</div>
<!-- Interaction Path -->
<div class="relative w-[400px] h-[300px] border-b-2 border-dashed border-outline-variant/50 mt-16">
<div class="absolute inset-0" id="packet-container">
<!-- Dynamic packet animation will happen here -->
</div>
<div class="absolute -bottom-6 left-0 right-0 flex justify-between text-label-caps text-outline-variant font-label-caps tracking-widest uppercase">
<span>Physical Link</span>
<span>10Gbps</span>
</div>
</div>
</div>
<!-- Right Action Sidebar -->
<aside class="w-80 h-full bg-surface-container-low border-l border-outline-variant flex flex-col overflow-y-auto">
<!-- Current Task Panel -->
<section class="p-panel-padding border-b border-outline-variant bg-white">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">assignment</span>
<h3 class="font-label-caps text-label-caps text-primary uppercase">当前任务</h3>
</div>
<p class="text-on-surface font-body-lg font-semibold leading-relaxed" id="task-text">
                    请选择客户端发出的第一个报文以开始建立连接。
                </p>
</section>
<!-- Action Cluster -->
<section class="p-panel-padding flex flex-col gap-3">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">ads_click</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">操作面板</h3>
</div>
<button class="w-full flex items-center justify-between p-3 bg-primary text-on-primary rounded-lg hover:brightness-110 transition-all group" onclick="sendPacket('SYN')">
<span class="font-body-sm font-semibold">发送 SYN (seq=x)</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">send</span>
</button>
<button class="w-full flex items-center justify-between p-3 bg-white border border-outline-variant text-on-surface-variant rounded-lg opacity-50 cursor-not-allowed" onclick="invalidAction('ACK')">
<span class="font-body-sm">发送 ACK (ack=y)</span>
<span class="material-symbols-outlined">lock</span>
</button>
<button class="w-full flex items-center justify-between p-3 bg-white border border-outline-variant text-on-surface-variant rounded-lg opacity-50 cursor-not-allowed" onclick="invalidAction('SYN-ACK')">
<span class="font-body-sm">发送 SYN-ACK</span>
<span class="material-symbols-outlined">lock</span>
</button>
</section>
<!-- Feedback / Logs -->
<section class="p-panel-padding mt-auto flex flex-col flex-1">
<div class="p-4 rounded-xl border border-outline-variant border-dashed flex flex-col items-center justify-center text-center gap-2 min-h-[120px] mb-6" id="feedback-area">
<span class="material-symbols-outlined text-outline-variant text-[32px]">hourglass_empty</span>
<p class="text-body-sm text-outline font-body-sm">等待操作反馈...</p>
</div>
<div class="bg-surface-container-high rounded-xl p-4 flex flex-col gap-3">
<h4 class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">history</span>
                        历史记录
                    </h4>
<div class="text-body-sm text-on-surface-variant italic font-body-sm flex flex-col gap-2" id="history-log">
                        等待操作...
                    </div>
</div>
</section>
</aside>
</main>
<!-- Bottom Timeline -->
<footer class="h-24 bg-surface border-t border-outline-variant px-gutter flex items-center justify-center gap-1">
<!-- Step 1 -->
<div class="flex items-center group">
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-on-primary ring-4 ring-primary/20 active-pulse z-10">
<span class="font-bold">1</span>
</div>
<span class="mt-1 font-label-caps text-label-caps text-primary whitespace-nowrap">SYN 发送</span>
</div>
<div class="w-32 h-[2px] bg-outline-variant mx-2 -mt-5"></div>
</div>
<!-- Step 2 -->
<div class="flex items-center group">
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-on-surface-variant border border-outline-variant z-10">
<span class="font-bold">2</span>
</div>
<span class="mt-1 font-label-caps text-label-caps text-on-surface-variant opacity-50 whitespace-nowrap">SYN-ACK 确认</span>
</div>
<div class="w-32 h-[2px] bg-outline-variant mx-2 -mt-5"></div>
</div>
<!-- Step 3 -->
<div class="flex items-center group">
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-on-surface-variant border border-outline-variant z-10">
<span class="font-bold">3</span>
</div>
<span class="mt-1 font-label-caps text-label-caps text-on-surface-variant opacity-50 whitespace-nowrap">ACK 确认</span>
</div>
<div class="w-32 h-[2px] bg-outline-variant mx-2 -mt-5"></div>
</div>
<!-- Step 4 -->
<div class="flex items-center group">
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-on-surface-variant border border-outline-variant z-10">
<span class="material-symbols-outlined text-[20px]">done_all</span>
</div>
<span class="mt-1 font-label-caps text-label-caps text-on-surface-variant opacity-50 whitespace-nowrap">ESTABLISHED</span>
</div>
</div>
</footer>
<script>
        function sendPacket(type) {
            if (type === 'SYN') {
                const container = document.getElementById('packet-container');
                const feedback = document.getElementById('feedback-area');
                const history = document.getElementById('history-log');
                const clientState = document.getElementById('client-state');

                // Animation
                const packet = document.createElement('div');
                packet.className = 'absolute top-1/2 -translate-y-1/2 left-0 w-12 h-8 bg-primary rounded shadow-lg flex items-center justify-center text-[10px] text-white font-code font-bold z-20 transition-all duration-1000 ease-in-out';
                packet.innerText = 'SYN';
                packet.style.left = '0%';
                container.appendChild(packet);

                // Start transition
                setTimeout(() => {
                    packet.style.left = 'calc(100% - 48px)';
                    clientState.innerText = 'SYN-SENT';
                    clientState.classList.replace('bg-surface-container-high', 'bg-primary-container');
                    clientState.classList.replace('text-on-surface-variant', 'text-on-primary-container');
                }, 100);

                // Update UI after arrival
                setTimeout(() => {
                    feedback.innerHTML = `
                        <div class="flex flex-col items-center gap-1 animate-in fade-in slide-in-from-bottom-2">
                            <span class="material-symbols-outlined text-primary text-[32px]">check_circle</span>
                            <p class="text-body-sm font-semibold text-primary">SYN 报文已到达服务端</p>
                            <p class="text-[12px] text-on-surface-variant">服务端状态更新为: SYN-RCVD</p>
                        </div>
                    `;
                    history.innerHTML = '<div class="flex items-center gap-2 text-primary font-semibold"><span>·</span> 客户端发出 SYN (seq=x)</div>' + history.innerHTML;
                    
                    document.getElementById('server-state').innerText = 'SYN-RCVD';
                    document.getElementById('task-text').innerText = '报文已送达。现在请模拟服务端返回确认报文。';
                }, 1100);
            }
        }

        function invalidAction(type) {
            const feedback = document.getElementById('feedback-area');
            feedback.innerHTML = `
                <div class="flex flex-col items-center gap-1 animate-pulse">
                    <span class="material-symbols-outlined text-error text-[32px]">warning</span>
                    <p class="text-body-sm font-semibold text-error">无效操作</p>
                    <p class="text-[12px] text-on-surface-variant">此时无法发送 ${type} 报文</p>
                </div>
            `;
        }
    </script>
</body></html>
